services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: papeleriagest
      POSTGRES_USER: papeleriagest
      POSTGRES_PASSWORD: papeleriagest
    ports:
      - "5433:5432"
    volumes:
      - papeleriagest_pg_data:/var/lib/postgresql/data

volumes:
  papeleriagest_pg_data:
